version: '3.8'

services:
  # ─── 1. DATABASE (MariaDB / MySQL) ───
  db:
    image: mariadb:10.11
    container_name: caffisense-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafficheck
    volumes:
      - caffisense_db_data:/var/lib/mysql
    networks:
      - caffisense-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── 2. MACHINE LEARNING ENGINE (FastAPI) ───
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: caffisense-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - caffisense-net

  # ─── 3. BACKEND API (Laravel 11) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caffisense-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      APP_NAME: "CaffiSense"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_KEY: "base64:4tjqDrxAhucRkrRDWpPpXwprqCNiqUcMRHst5HhO6zo="
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "cafficheck"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      SESSION_DRIVER: "database"
      CACHE_STORE: "database"
      QUEUE_CONNECTION: "database"
      ML_SERVICE_URL: "http://ml-service:8001"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - caffisense_storage:/var/www/html/storage/app/public
    ports:
      - "8000:8000"
    networks:
      - caffisense-net

  # ─── 4. FRONTEND (React + Vite + Nginx) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caffisense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - caffisense-net

networks:
  caffisense-net:
    driver: bridge

volumes:
  caffisense_db_data:
    driver: local
  caffisense_storage:
    driver: local
